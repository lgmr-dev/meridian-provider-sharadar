[extend]
useDefault = true

[allowlist]
description = "Git blob IDs of the pinned Meridian files"
paths = ['''^(contracts|tests/reference)/SOURCE\.json$''']

[[rules]]
id = "home-folder-path"
description = "A path in a user home folder"
regex = '''(/Users/|/home/|/root/|[A-Za-z]:\\{1,2}Users\\{1,2})[A-Za-z0-9._-]+'''
