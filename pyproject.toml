[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "B905", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["meridian_provider_sharadar"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/reference"]
norecursedirs = ["tests/reference"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error"]
